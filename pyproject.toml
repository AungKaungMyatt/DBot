[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "ASYNC"]

[tool.ruff.format]
line-ending = "lf"

[tool.coverage.run]
branch = true
source = ["bot", "mafia", "mafia_cards", "mafia_game", "mafia_lifecycle", "mafia_restart", "scripts.simulate_games"]

[tool.coverage.report]
show_missing = true
exclude_also = ['if __name__ == "__main__":']
